name: Build ForgeFit APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore Android project
        shell: python
        run: |
          import json, pathlib
          files = json.loads(r'''{"ForgeFitMVP/settings.gradle.kts":"pluginManagement {\n    repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories { google(); mavenCentral() }\n}\nrootProject.name = \"ForgeFit\"\ninclude(\":app\")\n","ForgeFitMVP/build.gradle.kts":"plugins {\n    id(\"com.android.application\") version \"8.10.1\" apply false\n    id(\"org.jetbrains.kotlin.android\") version \"2.0.21\" apply false\n    id(\"org.jetbrains.kotlin.plugin.compose\") version \"2.0.21\" apply false\n}\n","ForgeFitMVP/README.md":"# ForgeFit Android MVP\n\nForgeFit is a private, local-first adaptive home-workout app. It chooses today's training from sleep, energy, soreness, pain, time, steps, and previous performance. It is tailored to a home setup with 3, 5, 7.5, and 10 kg dumbbells plus adjustable weights up to 13.75 kg.\n\n## Recommendation rules\n\n- Pain 6+/10: rest and assessment prompt.\n- Pain 4–5/10 or readiness below 45: gentle recovery only.\n- Moderate readiness: strength session with two sets.\n- Good readiness: normal three-set strength session.\n- Complete the top of the rep range with good form and moderate effort: increase to the next available weight.\n- Complete the workout below the top of the range: keep the weight and add one rep per set next time.\n- Poor form or very high difficulty: hold the load.\n- When no heavier weight exists: add reps or use slower eccentrics.\n\nThis is experimental training guidance, not medical diagnosis. Stop exercises that cause pain or worsening symptoms.\n\n## Build and install\n\n### Android Studio\n\n1. Open this folder in the latest stable Android Studio.\n2. Allow Gradle sync to finish and install Android SDK 35 if prompted.\n3. Connect the Android phone with USB debugging enabled.\n4. Choose **Run > Run 'app'**.\n\n### GitHub build\n\nPush the project to a private GitHub repository. Open **Actions > Build Android APK > Run workflow**. Download the `ForgeFit-debug-apk` artifact and install `app-debug.apk` on the phone. Android may ask permission to install unknown apps.\n\n## Samsung Health\n\nSamsung Health should be configured to write Sleep and Steps to Android Health Connect. ForgeFit requests read-only access and has a manual fallback. The workout engine continues to work even when Health Connect is absent or permission is declined.\n\n## Current MVP limitations\n\n- Workout history is stored only on the device.\n- The quick log uses one average reps/difficulty value for loaded exercises.\n- No account, cloud sync, videos, notifications, subscription, or remote AI calls.\n- The APK is a debug build for personal testing, not a Play Store release.\n","ForgeFitMVP/gradle.properties":"org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\n","ForgeFitMVP/app/build.gradle.kts":"plugins {\n    id(\"com.android.application\")\n    id(\"org.jetbrains.kotlin.android\")\n    id(\"org.jetbrains.kotlin.plugin.compose\")\n}\n\nandroid {\n    namespace = \"com.allmight.forgefit\"\n    compileSdk = 36\n\n    defaultConfig {\n        applicationId = \"com.allmight.forgefit\"\n        minSdk = 28\n        targetSdk = 35\n        versionCode = 1\n        versionName = \"0.1.0\"\n        testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"\n    }\n    buildFeatures { compose = true }\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions { jvmTarget = \"17\" }\n    packaging { resources.excludes += \"/META-INF/{AL2.0,LGPL2.1}\" }\n}\n\ndependencies {\n    implementation(platform(\"androidx.compose:compose-bom:2024.12.01\"))\n    implementation(\"androidx.activity:activity-compose:1.10.0\")\n    implementation(\"androidx.compose.material3:material3\")\n    implementation(\"androidx.compose.material:material-icons-extended\")\n    implementation(\"androidx.compose.ui:ui\")\n    implementation(\"androidx.compose.ui:ui-tooling-preview\")\n    implementation(\"androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7\")\n    implementation(\"androidx.health.connect:connect-client:1.1.0\")\n    testImplementation(\"junit:junit:4.13.2\")\n    debugImplementation(\"androidx.compose.ui:ui-tooling\")\n}\n","ForgeFitMVP/.github/workflows/build-apk.yml":"name: Build Android APK\non:\n  workflow_dispatch:\n  push:\n    branches: [ main ]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '17'\n      - uses: gradle/actions/setup-gradle@v4\n        with:\n          gradle-version: '8.10.2'\n      - run: gradle testDebugUnitTest assembleDebug\n      - uses: actions/upload-artifact@v4\n        with:\n          name: ForgeFit-debug-apk\n          path: app/build/outputs/apk/debug/app-debug.apk\n","ForgeFitMVP/app/src/main/AndroidManifest.xml":"<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.health.READ_SLEEP\" />\n    <uses-permission android:name=\"android.permission.health.READ_STEPS\" />\n    <uses-permission android:name=\"android.permission.health.READ_TOTAL_CALORIES_BURNED\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"true\"\n        android:label=\"ForgeFit\"\n        android:theme=\"@style/Theme.ForgeFit\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n        <activity-alias\n            android:name=\"ViewPermissionUsageActivity\"\n            android:exported=\"true\"\n            android:targetActivity=\".MainActivity\"\n            android:permission=\"android.permission.START_VIEW_PERMISSION_USAGE\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.VIEW_PERMISSION_USAGE\" />\n                <category android:name=\"android.intent.category.HEALTH_PERMISSIONS\" />\n            </intent-filter>\n        </activity-alias>\n    </application>\n</manifest>\n","ForgeFitMVP/app/src/main/res/values/styles.xml":"<resources>\n    <style name=\"Theme.ForgeFit\" parent=\"android:style/Theme.Material.Light.NoActionBar\">\n        <item name=\"android:fontFamily\">sans</item>\n        <item name=\"android:colorAccent\">#7CFF6B</item>\n        <item name=\"android:navigationBarColor\">#0D0F0E</item>\n        <item name=\"android:statusBarColor\">#0D0F0E</item>\n        <item name=\"android:windowLightStatusBar\">false</item>\n    </style>\n</resources>\n","ForgeFitMVP/app/src/main/java/com/allmight/forgefit/AiCoach.kt":"package com.allmight.forgefit\n\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.withContext\nimport org.json.JSONArray\nimport org.json.JSONObject\nimport java.net.HttpURLConnection\nimport java.net.URL\n\n/** A provider-neutral chat interface. Keep the API key on a server, never in the APK. */\ninterface AiCoach {\n    suspend fun reply(message: String, context: String = \"\"): String\n}\n\n/** Calls a small backend that proxies an OpenAI-compatible chat endpoint. */\nclass RemoteAiCoach(private val endpoint: String) : AiCoach {\n    override suspend fun reply(message: String, context: String): String = withContext(Dispatchers.IO) {\n        val connection = (URL(endpoint).openConnection() as HttpURLConnection).apply {\n            requestMethod = \"POST\"\n            connectTimeout = 15_000\n            readTimeout = 30_000\n            doOutput = true\n            setRequestProperty(\"Content-Type\", \"application/json\")\n        }\n        val body = JSONObject().apply {\n            put(\"message\", message)\n            put(\"context\", context)\n        }.toString()\n        connection.outputStream.use { it.write(body.toByteArray()) }\n        val text = (if (connection.responseCode in 200..299) connection.inputStream else connection.errorStream)\n            .bufferedReader().use { it.readText() }\n        if (connection.responseCode !in 200..299) error(\"AI service error ${connection.responseCode}\")\n        JSONObject(text).optString(\"reply\", text)\n    }\n}\n\n/** Local fallback keeps the app useful when the AI service is not configured. */\nobject OfflineCoach : AiCoach {\n    override suspend fun reply(message: String, context: String): String =\n        \"AI coach is ready to connect. Add your secure backend URL to enable chat. \" +\n            \"For today, follow the generated plan and stop if pain increases.\"\n}\n","ForgeFitMVP/app/src/main/java/com/allmight/forgefit/WorkoutEngine.kt":"package com.allmight.forgefit\n\ndata class CheckIn(\n    val sleepHours: Double = 7.0,\n    val energy: Int = 3,\n    val soreness: Int = 2,\n    val pain: Int = 0,\n    val minutes: Int = 30,\n    val steps: Int = 0\n)\n\ndata class Performance(\n    val exercise: String,\n    val weightKg: Double,\n    val reps: Int,\n    val targetMax: Int,\n    val completedAllSets: Boolean,\n    val formGood: Boolean,\n    val difficulty: Int\n)\n\ndata class Exercise(\n    val name: String,\n    val sets: Int,\n    val reps: String,\n    val weightKg: Double?,\n    val restSeconds: Int,\n    val note: String = \"\"\n)\n\nenum class DayType { STRENGTH, RECOVERY, REST }\n\ndata class WorkoutPlan(\n    val title: String,\n    val type: DayType,\n    val readiness: Int,\n    val reason: String,\n    val duration: Int,\n    val exercises: List<Exercise>\n)\n\nclass WorkoutEngine {\n    fun readiness(c: CheckIn): Int {\n        var score = 100\n        if (c.sleepHours < 5) score -= 30 else if (c.sleepHours < 6.5) score -= 15\n        score -= (3 - c.energy).coerceAtLeast(0) * 10\n        score -= (c.soreness - 2).coerceAtLeast(0) * 8\n        score -= c.pain * 12\n        if (c.steps > 12_000) score -= 5\n        return score.coerceIn(0, 100)\n    }\n\n    fun progression(previous: Performance?): Pair<Double?, String> {\n        if (previous == null) return null to \"Start with clean reps and finish with 2–3 reps in reserve.\"\n        if (!previous.formGood || previous.difficulty >= 5) {\n            return null to \"Repeat this variation and improve control before progressing.\"\n        }\n        if (previous.completedAllSets && previous.reps >= previous.targetMax && previous.difficulty <= 3) {\n            return null to \"You reached the rep ceiling—use a harder variation or add a set.\"\n        }\n        if (previous.completedAllSets) {\n            return null to \"Keep this variation and add 1 rep per set next time.\"\n        }\n        return previous.weightKg to \"Repeat the same target until every set is completed cleanly.\"\n    }\n\n    fun generate(c: CheckIn, history: Map<String, Performance> = emptyMap()): WorkoutPlan {\n        val score = readiness(c)\n        if (c.pain >= 6) return WorkoutPlan(\n            \"Rest & assess\", DayType.REST, score,\n            \"Pain is high. Skip training today; seek medical advice if pain is severe, worsening, or includes weakness/numbness.\",\n            0, emptyList()\n        )\n        if (score < 45 || c.pain >= 4) return WorkoutPlan(\n            \"Gentle recovery\", DayType.RECOVERY, score,\n            \"Recovery or pain signals are too high for loaded training.\",\n            minOf(c.minutes, 20), listOf(\n                Exercise(\"Easy walk\", 1, \"10–15 min\", null, 0, \"Comfortable pace\"),\n                Exercise(\"Bird dog\", 2, \"6/side\", null, 45, \"Stop if symptoms travel down the leg\"),\n                Exercise(\"Glute bridge\", 2, \"10\", null, 45),\n                Exercise(\"Hip flexor stretch\", 2, \"30 sec/side\", null, 20)\n            )\n        )\n\n        val volume = when {\n            c.minutes < 20 -> 2\n            score < 70 -> 2\n            else -> 3\n        }\n        val library = listOf(\n            Triple(\"Chair squat\", \"10–15\", null),\n            Triple(\"Incline push-up\", \"6–12\", null),\n            Triple(\"Reverse lunge\", \"8–12/side\", null),\n            Triple(\"Glute bridge\", \"12–20\", null),\n            Triple(\"Pike push-up\", \"5–10\", null),\n            Triple(\"Dead bug\", \"6–10/side\", null),\n            Triple(\"Wall sit\", \"20–45 sec\", null),\n            Triple(\"Calf raise\", \"15–25\", null)\n        )\n        val count = when { c.minutes < 20 -> 4; c.minutes < 30 -> 5; else -> 6 }\n        val exercises = library.take(count).map { (name, reps, defaultWeight) ->\n            val (suggested, cue) = progression(history[name])\n            Exercise(name, volume, reps, suggested ?: defaultWeight, 60, cue)\n        }\n        return WorkoutPlan(\n            if (score >= 75) \"Full-body build\" else \"Full-body light\",\n            DayType.STRENGTH, score,\n            if (score >= 75) \"Your recovery supports normal training.\" else \"Training is useful today, with reduced volume.\",\n            c.minutes, exercises\n        )\n    }\n\n}\n","ForgeFitMVP/app/src/main/java/com/allmight/forgefit/MainActivity.kt":"package com.allmight.forgefit\n\nimport android.os.Bundle\nimport androidx.activity.ComponentActivity\nimport androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.compose.setContent\nimport androidx.compose.foundation.Canvas\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.foundation.verticalScroll\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.rounded.*\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.StrokeCap\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport kotlinx.coroutines.launch\nimport kotlinx.coroutines.delay\nimport java.util.Locale\n\nprivate val Ink = Color(0xFF0D0F0E)\nprivate val Panel = Color(0xFF191C1A)\nprivate val Lime = Color(0xFF7CFF6B)\nprivate val Muted = Color(0xFFAAB2AC)\n\nclass MainActivity : ComponentActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContent { ForgeFitApp(LocalStore(this), HealthReader(this)) }\n    }\n}\n\n@Composable\nprivate fun ForgeFitApp(store: LocalStore, health: HealthReader) {\n    val engine = remember { WorkoutEngine() }\n    val scope = rememberCoroutineScope()\n    var tab by remember { mutableIntStateOf(0) }\n    var snapshot by remember { mutableStateOf(HealthSnapshot(null, null)) }\n    var plan by remember { mutableStateOf<WorkoutPlan?>(null) }\n    var syncing by remember { mutableStateOf(false) }\n    var healthMessage by remember { mutableStateOf(\"Sync Samsung Health to personalize today\") }\n    var checkIn by remember { mutableStateOf(CheckIn()) }\n    var completed by remember { mutableStateOf(false) }\n    val sync: () -> Unit = {\n        scope.launch {\n            syncing = true\n            runCatching { health.read() }.onSuccess { s ->\n                snapshot = s\n                checkIn = checkIn.copy(sleepHours = s.sleepHours ?: checkIn.sleepHours, steps = s.steps ?: checkIn.steps)\n                healthMessage = if (s.sleepHours != null || s.steps != null) \"Synced just now\" else \"No Health Connect data found\"\n            }.onFailure { healthMessage = \"Sync unavailable; check Health Connect permissions\" }\n            syncing = false\n        }\n    }\n    val permissionLauncher = rememberLauncherForActivityResult(health.permissionContract) { granted ->\n        if (granted.containsAll(health.permissions)) sync() else healthMessage = \"Health permissions are needed for automatic data\"\n    }\n    LaunchedEffect(Unit) { if (health.available()) sync() }\n\n    MaterialTheme(colorScheme = darkColorScheme(primary = Lime, background = Ink, surface = Panel)) {\n        Scaffold(containerColor = Ink, bottomBar = {\n            NavigationBar(containerColor = Panel) {\n                listOf(\"Today\" to Icons.Rounded.Home, \"Progress\" to Icons.Rounded.ShowChart, \"Coach\" to Icons.Rounded.Chat).forEachIndexed { i, item ->\n                    NavigationBarItem(selected = tab == i, onClick = { tab = i }, icon = { Icon(item.second, null) }, label = { Text(item.first) })\n                }\n            }\n        }) { padding ->\n            Column(Modifier.fillMaxSize().padding(padding).verticalScroll(rememberScrollState()).padding(18.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {\n                Row(verticalAlignment = Alignment.CenterVertically) {\n                    Icon(Icons.Rounded.FitnessCenter, null, tint = Lime, modifier = Modifier.size(30.dp)); Spacer(Modifier.width(8.dp))\n                    Column { Text(\"FORGEFIT\", fontSize = 23.sp); Text(\"YOUR ADAPTIVE HOME COACH\", color = Muted, fontSize = 11.sp) }\n                }\n                when (tab) {\n                    0 -> TodayScreen(checkIn, snapshot, healthMessage, syncing, plan, completed, store.sessions(), onSync = {\n                        if (health.available()) permissionLauncher.launch(health.permissions) else healthMessage = \"Install Health Connect first\"\n                    }, onChange = { checkIn = it }, onBuild = { plan = engine.generate(checkIn, store.loadPerformance()); completed = false }, onComplete = { reps, diff -> plan?.let { store.saveWorkout(it, reps, diff); completed = true } }, onBack = { plan = null })\n                    1 -> ProgressScreen(store.history(), snapshot)\n                    else -> CoachScreen(plan, checkIn)\n                }\n            }\n        }\n    }\n}\n\n@Composable private fun TodayScreen(c: CheckIn, s: HealthSnapshot, msg: String, syncing: Boolean, plan: WorkoutPlan?, completed: Boolean, sessions: Int, onSync: () -> Unit, onChange: (CheckIn) -> Unit, onBuild: () -> Unit, onComplete: (Int, Int) -> Unit, onBack: () -> Unit) {\n    if (plan == null) {\n        Text(\"Good morning, Mark\", fontSize = 28.sp); Text(\"Your workout adapts to your body today.\", color = Muted)\n        HealthCard(s, msg, syncing, onSync)\n        Metric(\"Energy\", \"${c.energy}/5\", c.energy.toFloat(), 1f..5f) { onChange(c.copy(energy = it.toInt())) }\n        Metric(\"Soreness\", \"${c.soreness}/5\", c.soreness.toFloat(), 1f..5f) { onChange(c.copy(soreness = it.toInt())) }\n        Metric(\"Pain\", \"${c.pain}/10\", c.pain.toFloat(), 0f..10f) { onChange(c.copy(pain = it.toInt())) }\n        Text(\"Time available\", color = Muted); Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { listOf(15, 20, 30, 45).forEach { n -> FilterChip(c.minutes == n, { onChange(c.copy(minutes = n)) }, label = { Text(\"$n min\") }) } }\n        Button(onClick = onBuild, modifier = Modifier.fillMaxWidth().height(56.dp), shape = RoundedCornerShape(16.dp)) { Text(\"GENERATE TODAY'S WORKOUT\") }\n    } else PlanCard(plan, completed, sessions, onComplete, onBack)\n}\n\n@Composable private fun HealthCard(s: HealthSnapshot, msg: String, syncing: Boolean, onSync: () -> Unit) {\n    Card(colors = CardDefaults.cardColors(containerColor = Panel), shape = RoundedCornerShape(18.dp)) { Column(Modifier.padding(15.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {\n        Row(verticalAlignment = Alignment.CenterVertically) { Icon(Icons.Rounded.Sync, null, tint = Lime); Spacer(Modifier.width(8.dp)); Text(\"SAMSUNG HEALTH\", color = Lime) }\n        Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Stat(\"Sleep\", s.sleepHours?.let { \"%.1f h\".format(Locale.US, it) } ?: \"—\"); Stat(\"Steps\", s.steps?.toString() ?: \"—\"); Stat(\"Calories\", s.calories?.toInt()?.toString() ?: \"—\") }\n        Text(msg, color = Muted, fontSize = 12.sp); OutlinedButton(onClick = onSync, enabled = !syncing) { Text(if (syncing) \"SYNCING…\" else \"SYNC NOW\") }\n    } }\n}\n@Composable private fun Stat(label: String, value: String) { Column { Text(label, color = Muted, fontSize = 11.sp); Text(value, color = Color.White, fontSize = 18.sp) } }\n@Composable private fun Metric(label: String, value: String, pos: Float, range: ClosedFloatingPointRange<Float>, onChange: (Float) -> Unit) { Card(colors = CardDefaults.cardColors(containerColor = Panel), shape = RoundedCornerShape(16.dp)) { Column(Modifier.padding(14.dp)) { Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text(label, color = Muted); Text(value, color = Lime) }; Slider(pos, onChange, valueRange = range) } } }\n\n@Composable private fun PlanCard(plan: WorkoutPlan, completed: Boolean, sessions: Int, onComplete: (Int, Int) -> Unit, onBack: () -> Unit) {\n    var exerciseIndex by remember { mutableIntStateOf(0) }\n    var setIndex by remember { mutableIntStateOf(0) }\n    var reps by remember { mutableIntStateOf(10) }\n    var difficulty by remember { mutableIntStateOf(3) }\n    var restLeft by remember { mutableIntStateOf(0) }\n    var totalLogged by remember { mutableIntStateOf(0) }\n    var setsLogged by remember { mutableIntStateOf(0) }\n    val current = plan.exercises.getOrNull(exerciseIndex)\n    LaunchedEffect(restLeft) { if (restLeft > 0) { delay(1000); restLeft -= 1 } }\n\n    Text(plan.title, fontSize = 28.sp)\n    Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { Badge(\"READINESS ${plan.readiness}\"); Badge(\"$sessions SESSIONS\") }\n    Text(plan.reason, color = Muted)\n    if (plan.type == DayType.REST) Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF3B2020))) { Text(plan.reason, Modifier.padding(15.dp)) }\n    if (current != null && plan.type == DayType.STRENGTH && !completed) {\n        Text(\"Exercise ${exerciseIndex + 1} of ${plan.exercises.size}\", color = Muted)\n        Card(colors = CardDefaults.cardColors(containerColor = Panel), shape = RoundedCornerShape(20.dp)) {\n            Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {\n                Text(current.name, fontSize = 24.sp)\n                Text(current.note.ifBlank { \"Move slowly and keep every rep comfortable.\" }, color = Muted)\n                Text(\"Set ${setIndex + 1} of ${current.sets}\", color = Lime, fontSize = 17.sp)\n                Text(\"Completed reps: $reps\", color = Muted)\n                Slider(reps.toFloat(), { reps = it.toInt() }, valueRange = 1f..25f)\n                if (restLeft > 0) Text(\"Rest ${restLeft}s\", color = Lime, fontSize = 22.sp)\n                else Button(onClick = {\n                    totalLogged += reps; setsLogged += 1; restLeft = current.restSeconds\n                    if (setIndex + 1 < current.sets) setIndex += 1\n                    else if (exerciseIndex + 1 < plan.exercises.size) { exerciseIndex += 1; setIndex = 0 }\n                }, Modifier.fillMaxWidth()) { Text(if (setIndex + 1 == current.sets && exerciseIndex + 1 == plan.exercises.size) \"FINISH FINAL SET\" else \"LOG SET & REST\") }\n                OutlinedButton(onClick = {\n                    if (exerciseIndex + 1 < plan.exercises.size) { exerciseIndex += 1; setIndex = 0 }\n                }, Modifier.fillMaxWidth(), enabled = exerciseIndex + 1 < plan.exercises.size) { Text(\"SKIP / REPLACE EXERCISE\") }\n            }\n        }\n        Text(\"Session progress: $setsLogged sets\", color = Muted)\n        Text(\"How hard is this session? $difficulty/5\", color = Muted)\n        Slider(difficulty.toFloat(), { difficulty = it.toInt() }, valueRange = 1f..5f)\n        if (setsLogged >= plan.exercises.sumOf { it.sets }) Button({ onComplete((totalLogged / setsLogged.coerceAtLeast(1)), difficulty) }, Modifier.fillMaxWidth()) { Text(\"SAVE COMPLETE WORKOUT\") }\n    } else {\n        plan.exercises.forEachIndexed { i, e -> Card(colors = CardDefaults.cardColors(containerColor = Panel), shape = RoundedCornerShape(16.dp)) { Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) { Text(\"${i + 1}. ${e.name}\", fontSize = 17.sp); Text(\"${e.sets} sets × ${e.reps}\", color = Lime); Text(e.note, color = Muted, fontSize = 12.sp) } } }\n    }\n    if (completed) Text(\"Saved. Your next workout will use these sets and reps to adjust difficulty.\", color = Lime)\n    OutlinedButton(onBack, Modifier.fillMaxWidth()) { Text(\"BACK TO CHECK-IN\") }\n}\n@Composable private fun Badge(text: String) = Surface(color = Color(0xFF253027), shape = RoundedCornerShape(8.dp)) { Text(text, Modifier.padding(8.dp), color = Lime, fontSize = 11.sp) }\n\n@Composable private fun ProgressScreen(history: List<TrainingDay>, s: HealthSnapshot) {\n    Text(\"Your progress\", fontSize = 28.sp); Text(\"Training consistency and recovery at a glance.\", color = Muted)\n    Card(colors = CardDefaults.cardColors(containerColor = Panel), shape = RoundedCornerShape(18.dp)) { Column(Modifier.padding(15.dp)) { Text(\"Workout volume\", color = Lime); if (history.isEmpty()) Text(\"Complete workouts to see your graph\", color = Muted, modifier = Modifier.padding(vertical = 35.dp)) else LineGraph(history.map { it.volume.toFloat() }, Lime) } }\n    Card(colors = CardDefaults.cardColors(containerColor = Panel), shape = RoundedCornerShape(18.dp)) { Column(Modifier.padding(15.dp)) { Text(\"Readiness\", color = Lime); if (history.isNotEmpty()) LineGraph(history.map { it.readiness.toFloat() }, Color(0xFF62B9FF)) else Text(\"Readiness history will appear here\", color = Muted, modifier = Modifier.padding(vertical = 35.dp)) } }\n    history.takeLast(5).reversed().forEach { Text(\"${it.title} • readiness ${it.readiness} • ${it.volume} reps\", color = Muted) }\n}\n@Composable private fun LineGraph(values: List<Float>, color: Color) { Canvas(Modifier.fillMaxWidth().height(150.dp).padding(vertical = 15.dp)) { if (values.size > 1) { val max = values.maxOrNull()?.coerceAtLeast(1f) ?: 1f; val min = values.minOrNull() ?: 0f; val range = (max - min).coerceAtLeast(1f); val pts = values.mapIndexed { i, v -> androidx.compose.ui.geometry.Offset(i * size.width / (values.size - 1), size.height - ((v - min) / range) * size.height) }; for (i in 0 until pts.lastIndex) drawLine(color, pts[i], pts[i + 1], 5f, StrokeCap.Round); pts.forEach { drawCircle(color, 6f, it) } } } }\n\n@Composable private fun CoachScreen(plan: WorkoutPlan?, c: CheckIn) { var input by remember { mutableStateOf(\"\") }; var reply by remember { mutableStateOf(\"Ask me about today’s workout, recovery, reps, or progression.\") }; val scope = rememberCoroutineScope(); Text(\"AI coach\", fontSize = 28.sp); Text(\"Your health data and workout plan stay available as context.\", color = Muted); Card(colors = CardDefaults.cardColors(containerColor = Panel), shape = RoundedCornerShape(18.dp)) { Column(Modifier.padding(15.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) { Text(reply); OutlinedTextField(input, { input = it }, Modifier.fillMaxWidth(), placeholder = { Text(\"Ask your coach…\") }); Button({ scope.launch { reply = OfflineCoach.reply(input, \"sleep=${c.sleepHours}, energy=${c.energy}, pain=${c.pain}, plan=${plan?.title}\") } }, enabled = input.isNotBlank()) { Text(\"ASK COACH\") } } } }\n","ForgeFitMVP/app/src/main/java/com/allmight/forgefit/LocalStore.kt":"package com.allmight.forgefit\n\nimport android.content.Context\nimport org.json.JSONArray\nimport org.json.JSONObject\n\nclass LocalStore(context: Context) {\n    private val prefs = context.getSharedPreferences(\"forgefit\", Context.MODE_PRIVATE)\n\n    fun loadPerformance(): Map<String, Performance> {\n        val raw = prefs.getString(\"performance\", \"[]\") ?: \"[]\"\n        return runCatching {\n            val array = JSONArray(raw)\n            (0 until array.length()).associate { i ->\n                val o = array.getJSONObject(i)\n                val p = Performance(\n                    o.getString(\"exercise\"), o.getDouble(\"weight\"), o.getInt(\"reps\"),\n                    o.getInt(\"max\"), o.getBoolean(\"allSets\"), o.getBoolean(\"formGood\"),\n                    o.getInt(\"difficulty\")\n                )\n                p.exercise to p\n            }\n        }.getOrDefault(emptyMap())\n    }\n\n    fun saveWorkout(plan: WorkoutPlan, reps: Int, difficulty: Int) {\n        val current = loadPerformance().toMutableMap()\n        plan.exercises.forEach { e ->\n            val max = e.reps.substringBefore('/').substringAfter('–', e.reps).filter(Char::isDigit)\n                .toIntOrNull() ?: reps\n            current[e.name] = Performance(e.name, e.weightKg ?: 0.0, reps, max, true, difficulty <= 4, difficulty)\n        }\n        val array = JSONArray()\n        current.values.forEach { p ->\n            array.put(JSONObject().apply {\n                put(\"exercise\", p.exercise); put(\"weight\", p.weightKg); put(\"reps\", p.reps)\n                put(\"max\", p.targetMax); put(\"allSets\", p.completedAllSets)\n                put(\"formGood\", p.formGood); put(\"difficulty\", p.difficulty)\n            })\n        }\n        val history = JSONArray(prefs.getString(\"history\", \"[]\") ?: \"[]\")\n        history.put(JSONObject().apply {\n            put(\"time\", System.currentTimeMillis()); put(\"title\", plan.title)\n            put(\"readiness\", plan.readiness); put(\"volume\", plan.exercises.sumOf { it.sets * reps })\n            put(\"difficulty\", difficulty)\n        })\n        while (history.length() > 30) history.remove(0)\n        prefs.edit().putString(\"performance\", array.toString())\n            .putString(\"history\", history.toString())\n            .putInt(\"sessions\", prefs.getInt(\"sessions\", 0) + 1).apply()\n    }\n\n    fun sessions() = prefs.getInt(\"sessions\", 0)\n\n    fun history(): List<TrainingDay> = runCatching {\n        val a = JSONArray(prefs.getString(\"history\", \"[]\") ?: \"[]\")\n        (0 until a.length()).map { i ->\n            val o = a.getJSONObject(i)\n            TrainingDay(o.getLong(\"time\"), o.getString(\"title\"), o.getInt(\"readiness\"), o.getInt(\"volume\"), o.getInt(\"difficulty\"))\n        }\n    }.getOrDefault(emptyList())\n}\n\ndata class TrainingDay(val time: Long, val title: String, val readiness: Int, val volume: Int, val difficulty: Int)\n","ForgeFitMVP/app/src/main/java/com/allmight/forgefit/HealthReader.kt":"package com.allmight.forgefit\n\nimport android.content.Context\nimport androidx.health.connect.client.HealthConnectClient\nimport androidx.health.connect.client.PermissionController\nimport androidx.health.connect.client.permission.HealthPermission\nimport androidx.health.connect.client.records.SleepSessionRecord\nimport androidx.health.connect.client.records.StepsRecord\nimport androidx.health.connect.client.records.TotalCaloriesBurnedRecord\nimport androidx.health.connect.client.request.ReadRecordsRequest\nimport androidx.health.connect.client.time.TimeRangeFilter\nimport java.time.Duration\nimport java.time.Instant\nimport java.time.temporal.ChronoUnit\n\ndata class HealthSnapshot(val sleepHours: Double?, val steps: Int?, val calories: Double? = null, val syncedAt: Long = System.currentTimeMillis())\n\nclass HealthReader(private val context: Context) {\n    val permissions = setOf(\n        HealthPermission.getReadPermission(SleepSessionRecord::class),\n        HealthPermission.getReadPermission(StepsRecord::class),\n        HealthPermission.getReadPermission(TotalCaloriesBurnedRecord::class)\n    )\n    val permissionContract = PermissionController.createRequestPermissionResultContract()\n\n    fun available(): Boolean =\n        HealthConnectClient.getSdkStatus(context) == HealthConnectClient.SDK_AVAILABLE\n\n    suspend fun hasPermissions(): Boolean = available() &&\n        HealthConnectClient.getOrCreate(context).permissionController\n            .getGrantedPermissions().containsAll(permissions)\n\n    suspend fun read(): HealthSnapshot {\n        if (!hasPermissions()) return HealthSnapshot(null, null)\n        val client = HealthConnectClient.getOrCreate(context)\n        val now = Instant.now()\n        val dayAgo = now.minus(24, ChronoUnit.HOURS)\n        val sleep = client.readRecords(\n            ReadRecordsRequest(SleepSessionRecord::class, TimeRangeFilter.between(dayAgo, now))\n        ).records.sumOf { Duration.between(it.startTime, it.endTime).toMinutes() } / 60.0\n        val startOfDay = now.truncatedTo(ChronoUnit.DAYS)\n        val steps = client.readRecords(\n            ReadRecordsRequest(StepsRecord::class, TimeRangeFilter.between(startOfDay, now))\n        ).records.sumOf { it.count }.toInt()\n        val calories = client.readRecords(\n            ReadRecordsRequest(TotalCaloriesBurnedRecord::class, TimeRangeFilter.between(startOfDay, now))\n        ).records.sumOf { it.energy.inKilocalories }\n        return HealthSnapshot(sleep.takeIf { it > 0 }, steps.takeIf { it > 0 }, calories.takeIf { it > 0.0 })\n    }\n}\n","ForgeFitMVP/app/src/test/java/com/allmight/forgefit/WorkoutEngineTest.kt":"package com.allmight.forgefit\n\nimport org.junit.Assert.*\nimport org.junit.Test\n\nclass WorkoutEngineTest {\n    private val engine = WorkoutEngine()\n\n    @Test fun highPainCreatesRestDay() {\n        val plan = engine.generate(CheckIn(pain = 7))\n        assertEquals(DayType.REST, plan.type)\n        assertTrue(plan.exercises.isEmpty())\n    }\n\n    @Test fun poorRecoveryCreatesRecoveryDay() {\n        val plan = engine.generate(CheckIn(sleepHours = 4.0, energy = 1, soreness = 5))\n        assertEquals(DayType.RECOVERY, plan.type)\n    }\n\n    @Test fun successfulTopRangeIncreasesDifficulty() {\n        val old = Performance(\"Incline push-up\", 0.0, 12, 12, true, true, 3)\n        val result = engine.progression(old)\n        assertNull(result.first)\n        assertTrue(result.second.contains(\"harder variation\"))\n    }\n\n    @Test fun successfulMidRangeAddsRep() {\n        val old = Performance(\"Incline push-up\", 0.0, 10, 12, true, true, 3)\n        val result = engine.progression(old)\n        assertNull(result.first)\n        assertTrue(result.second.contains(\"add 1 rep\"))\n    }\n}\n"}''')
